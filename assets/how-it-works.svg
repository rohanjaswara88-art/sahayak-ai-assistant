<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-label="How Sahayak works: speak, understand, guide, hear">
<rect width="800" height="320" rx="24" fill="#fffaf2"/>
<text x="400" y="44" text-anchor="middle" font-family="'Noto Sans Devanagari','Nirmala UI','Segoe UI',sans-serif" font-size="26" font-weight="700" fill="#1d2433">How it works</text>
<path d="M100 120H700" stroke="#eadfce" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 12"/>
<g transform="translate(100 120)"><circle r="46" fill="#e8700a" opacity=".16"/><circle r="38" fill="#c9b9a0"/><circle r="38" fill="#e8700a" opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.23;.25;1" dur="8s" begin="0s" repeatCount="indefinite"/></circle><g><rect x="-8" y="-20" width="16" height="26" rx="8" fill="#fff"/><path d="M-15 -2a15 15 0 0 0 30 0M0 13v9M-9 22h18" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round"/></g></g>
<text x="100" y="196" text-anchor="middle" font-family="'Noto Sans Devanagari','Nirmala UI','Segoe UI',sans-serif" font-size="19" font-weight="700" fill="#1d2433">1  Speak</text>
<text x="100" y="219" text-anchor="middle" font-family="'Noto Sans Devanagari','Nirmala UI','Segoe UI',sans-serif" font-size="16" fill="#5b6475">बोलिए</text>
<g transform="translate(300 120)"><circle r="46" fill="#e8700a" opacity=".16"/><circle r="38" fill="#c9b9a0"/><circle r="38" fill="#e8700a" opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.23;.25;1" dur="8s" begin="2s" repeatCount="indefinite"/></circle><g><circle cx="-3" cy="-3" r="13" fill="none" stroke="#fff" stroke-width="4"/><path d="M7 7l12 12" stroke="#fff" stroke-width="5" stroke-linecap="round"/></g></g>
<text x="300" y="196" text-anchor="middle" font-family="'Noto Sans Devanagari','Nirmala UI','Segoe UI',sans-serif" font-size="19" font-weight="700" fill="#1d2433">2  Understand</text>
<text x="300" y="219" text-anchor="middle" font-family="'Noto Sans Devanagari','Nirmala UI','Segoe UI',sans-serif" font-size="16" fill="#5b6475">समझता है</text>
<g transform="translate(500 120)"><circle r="46" fill="#e8700a" opacity=".16"/><circle r="38" fill="#c9b9a0"/><circle r="38" fill="#e8700a" opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.23;.25;1" dur="8s" begin="4s" repeatCount="indefinite"/></circle><g><g fill="#fff"><circle cx="-14" cy="-12" r="3.5"/><rect x="-6" y="-15" width="22" height="6" rx="3"/><circle cx="-14" cy="0" r="3.5"/><rect x="-6" y="-3" width="22" height="6" rx="3"/><circle cx="-14" cy="12" r="3.5"/><rect x="-6" y="9" width="22" height="6" rx="3"/></g></g></g>
<text x="500" y="196" text-anchor="middle" font-family="'Noto Sans Devanagari','Nirmala UI','Segoe UI',sans-serif" font-size="19" font-weight="700" fill="#1d2433">3  Guide</text>
<text x="500" y="219" text-anchor="middle" font-family="'Noto Sans Devanagari','Nirmala UI','Segoe UI',sans-serif" font-size="16" fill="#5b6475">कदम-कदम</text>
<g transform="translate(700 120)"><circle r="46" fill="#e8700a" opacity=".16"/><circle r="38" fill="#c9b9a0"/><circle r="38" fill="#e8700a" opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.23;.25;1" dur="8s" begin="6s" repeatCount="indefinite"/></circle><g><path d="M-18 -7h10l12 -11v36l-12 -11h-10z" fill="#fff"/><path d="M12 -10a14 14 0 0 1 0 20M18 -17a24 24 0 0 1 0 34" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round"/></g></g>
<text x="700" y="196" text-anchor="middle" font-family="'Noto Sans Devanagari','Nirmala UI','Segoe UI',sans-serif" font-size="19" font-weight="700" fill="#1d2433">4  Hear</text>
<text x="700" y="219" text-anchor="middle" font-family="'Noto Sans Devanagari','Nirmala UI','Segoe UI',sans-serif" font-size="16" fill="#5b6475">सुनिए</text>
<circle r="7" fill="#e8700a"><animateMotion dur="8s" repeatCount="indefinite" path="M100 120H700" keyTimes="0;1" keyPoints="0;1" calcMode="linear"/></circle>
<g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.23;.25;1" dur="8s" begin="0s" repeatCount="indefinite"/><rect x="150" y="248" width="500" height="54" rx="27" fill="#fde7cf"/><text x="400" y="272" text-anchor="middle" font-family="'Noto Sans Devanagari','Nirmala UI','Segoe UI',sans-serif" font-size="19" font-weight="700" fill="#1d2433">“आधार कार्ड बनवाना है”</text><text x="400" y="292" text-anchor="middle" font-family="'Noto Sans Devanagari','Nirmala UI','Segoe UI',sans-serif" font-size="14" fill="#5b6475">You say it in your own language</text></g>
<g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.23;.25;1" dur="8s" begin="2s" repeatCount="indefinite"/><rect x="150" y="248" width="500" height="54" rx="27" fill="#fde7cf"/><text x="400" y="272" text-anchor="middle" font-family="'Noto Sans Devanagari','Nirmala UI','Segoe UI',sans-serif" font-size="19" font-weight="700" fill="#1d2433">Hindi, English and Hinglish</text><text x="400" y="292" text-anchor="middle" font-family="'Noto Sans Devanagari','Nirmala UI','Segoe UI',sans-serif" font-size="14" fill="#5b6475">It matches your words to the right guide</text></g>
<g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.23;.25;1" dur="8s" begin="4s" repeatCount="indefinite"/><rect x="150" y="248" width="500" height="54" rx="27" fill="#fde7cf"/><text x="400" y="272" text-anchor="middle" font-family="'Noto Sans Devanagari','Nirmala UI','Segoe UI',sans-serif" font-size="19" font-weight="700" fill="#1d2433">One short step at a time</text><text x="400" y="292" text-anchor="middle" font-family="'Noto Sans Devanagari','Nirmala UI','Segoe UI',sans-serif" font-size="14" fill="#5b6475">Say “अगला” (next) or tap the green button</text></g>
<g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.23;.25;1" dur="8s" begin="6s" repeatCount="indefinite"/><rect x="150" y="248" width="500" height="54" rx="27" fill="#fde7cf"/><text x="400" y="272" text-anchor="middle" font-family="'Noto Sans Devanagari','Nirmala UI','Segoe UI',sans-serif" font-size="19" font-weight="700" fill="#1d2433">A clear Hindi voice reads it out</text><text x="400" y="292" text-anchor="middle" font-family="'Noto Sans Devanagari','Nirmala UI','Segoe UI',sans-serif" font-size="14" fill="#5b6475">So you can listen without reading</text></g>
</svg>