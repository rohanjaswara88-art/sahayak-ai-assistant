<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" role="img" aria-label="Sahayak voice assistant animation">
  <rect width="800" height="260" rx="24" fill="#fffaf2"/>
  <g transform="translate(160 130)">
    <circle r="46" fill="#e8700a" opacity=".25">
      <animate attributeName="r" values="46;100;46" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".35;0;.35" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="46" fill="#e8700a" opacity=".25">
      <animate attributeName="r" values="46;100;46" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".35;0;.35" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="56" fill="#e8700a"/>
    <rect x="-11" y="-30" width="22" height="38" rx="11" fill="#fff"/>
    <path d="M-20 -2a20 20 0 0 0 40 0M0 18v14M-12 32h24" stroke="#fff" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  </g>
  <g fill="#e8700a">
    <rect x="270" y="112" width="10" height="36" rx="5"><animate attributeName="height" values="36;76;36" dur="1s" repeatCount="indefinite"/><animate attributeName="y" values="112;92;112" dur="1s" repeatCount="indefinite"/></rect>
    <rect x="292" y="112" width="10" height="36" rx="5"><animate attributeName="height" values="36;96;36" dur="1s" begin=".15s" repeatCount="indefinite"/><animate attributeName="y" values="112;82;112" dur="1s" begin=".15s" repeatCount="indefinite"/></rect>
    <rect x="314" y="112" width="10" height="36" rx="5"><animate attributeName="height" values="36;60;36" dur="1s" begin=".3s" repeatCount="indefinite"/><animate attributeName="y" values="112;100;112" dur="1s" begin=".3s" repeatCount="indefinite"/></rect>
    <rect x="336" y="112" width="10" height="36" rx="5"><animate attributeName="height" values="36;84;36" dur="1s" begin=".45s" repeatCount="indefinite"/><animate attributeName="y" values="112;88;112" dur="1s" begin=".45s" repeatCount="indefinite"/></rect>
  </g>
  <g font-family="'Noto Sans Devanagari','Nirmala UI','Segoe UI',sans-serif" fill="#1d2433">
    <text x="400" y="128" font-size="48" font-weight="700">
      नमस्ते
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.42;.5;.92;1" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="400" y="128" font-size="48" font-weight="700" opacity="0">
      Hello
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.42;.5;.92;1" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="400" y="172" font-size="24" fill="#5b6475">
      मैं आपकी मदद करूँगा
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.42;.5;.92;1" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="400" y="172" font-size="24" fill="#5b6475" opacity="0">
      I will help you step by step
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.42;.5;.92;1" dur="6s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
