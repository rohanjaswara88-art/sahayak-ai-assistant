<text x="400" y="44" text-anchor="middle" font-family="'Noto Sans Devanagari','Nirmala UI','Segoe UI',sans-serif" font-size="26" font-weight="700" fill="#1d2433">What makes it special</text>
<g transform="translate(20 70)"><rect width="240" height="116" rx="20" fill="#fff" stroke="#eadfce" stroke-width="2"/><g transform="translate(120 36)"><rect x="-34" y="-14" width="68" height="28" rx="14" fill="#fde7cf"/><circle r="11" cy="0" fill="#e8700a"><animate attributeName="cx" values="-20;20;-20" dur="3s" repeatCount="indefinite"/></circle><text x="-20" y="5" text-anchor="middle" font-family="'Noto Sans Devanagari','Nirmala UI','Segoe UI',sans-serif" font-size="12" font-weight="700" fill="#1d2433">हि</text><text x="20" y="5" text-anchor="middle" font-size="12" font-weight="700" fill="#1d2433">En</text></g><text x="120" y="82" text-anchor="middle" font-family="'Noto Sans Devanagari','Nirmala UI','Segoe UI',sans-serif" font-size="17" font-weight="700" fill="#1d2433">Hindi + English</text><text x="120" y="102" text-anchor="middle" font-family="'Noto Sans Devanagari','Nirmala UI','Segoe UI',sans-serif" font-size="13.5" fill="#5b6475">बोलिए और सुनिए, अपनी भाषा में</text></g>
<g transform="translate(280 70)"><rect width="240" height="116" rx="20" fill="#fff" stroke="#eadfce" stroke-width="2"/><g transform="translate(120 36)"><circle r="14" fill="#e8700a" opacity=".3"><animate attributeName="r" values="14;30;14" dur="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values=".4;0;.4" dur="1.8s" repeatCount="indefinite"/></circle><circle r="14" fill="#e8700a"/><rect x="-4" y="-9" width="8" height="13" rx="4" fill="#fff"/><path d="M-8 0a8 8 0 0 0 16 0M0 8v4" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></g><text x="120" y="82" text-anchor="middle" font-family="'Noto Sans Devanagari','Nirmala UI','Segoe UI',sans-serif" font-size="17" font-weight="700" fill="#1d2433">Hears you clearly</text><text x="120" y="102" text-anchor="middle" font-family="'Noto Sans Devanagari','Nirmala UI','Segoe UI',sans-serif" font-size="13.5" fill="#5b6475">Noise reduction + live mic ring</text></g>
